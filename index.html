    {id:"heating",icon:"🔥",label:"Heating or cooling",service:"HVAC",resources:["Heating Assistance","Energy Rebates","Energy & Health"]},
    {id:"roof",icon:"🏠",label:"Roof or structural",service:"Roofer",resources:["Grants & Loans","Free Home Repairs","Rural Grants"]},
    {id:"general",icon:"🪚",label:"General repairs / maintenance",service:"Handyman",resources:["Free Home Repairs","Volunteer Chore Services","Accessibility & Repairs"]},
    {id:"cleaning",icon:"🧹",label:"Cleaning or upkeep",service:"House Cleaner",resources:["Volunteer Chore Services","Community Help"]},
    {id:"outdoor",icon:"🌲",label:"Garden / outdoor",service:"Landscaper",resources:["Community Help"]},
    {id:"painting",icon:"🖌️",label:"Painting",service:"Painter",resources:["Free Home Repairs","Volunteer Chore Services"]},
  ];
 
  const SEARCH_KEYWORDS = [
    "Leak repair","Water heaters","Drain cleaning","Pipe repair","Sewer lines","Fixture installation",
    "Drainage service","Plumbing fixtures","Backflow testing","Sewer contractor",
    "Panel upgrades","EV chargers","Outlet installation","Rewiring","Safety inspections",
    "Lighting","Commercial electrical","Residential electrical","Generator hookup","Low voltage cabling",
    "Drywall","Door & window repair","Furniture assembly","Home repair","Home maintenance",
    "Property preservation","Gutter cleaning","Fence building","Kitchen remodeling","Rot repair",
    "Heating & cooling","Furnace repair","HVAC","Duct cleaning","Air sealing","Insulation",
    "Roof repair","Structural steel","Roofing",
    "Interior painting","Exterior painting","Concrete staining","Pressure washing",
    "Deep clean","Move-in/out","Regular visits","House cleaning","Maid service",
    "Lawn service","Landscape design","Planting & pruning","Sod installation","Lawn maintenance",
    "Carpentry","Deck construction","Custom furniture","Resin work","Fence repair",
    "Tiling","Flooring","Sheetrock repair","Bathroom remodels","Accessibility modifications",
    "Ramp installation","Grab bars","Wheelchair ramps","ADA access",
    "Home inspections","Pest inspections","Property preservation",
    "Custom metalwork","Wrought iron railings","Ornamental iron","Steel canopies",
    "Residential remodeling","General contracting","Project management",
    "Women-owned","LGBTQ+ inclusive","Bilingual","Spanish speaking",
  ];
 
  const runQuiz = (answers) => {
    const problem = QUIZ_PROBLEMS.find(p=>p.id===answers.problem) || QUIZ_PROBLEMS[4];
    const needsGrant = answers.budget === "low" || answers.budget === "free";
    const isUrgent = answers.urgency === "urgent";
    setQuizResult({service: problem.service, resourceTypes: problem.resources, needsGrant, isUrgent, problemLabel: problem.label});
    setStep("quiz-result");
  };
 
  const hdr = {display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 20px",background:C.forest,position:"sticky",top:0,zIndex:50,gap:10,flexWrap:"wrap"};
  const pg = {maxWidth:640,margin:"0 auto",padding:"24px 16px 80px"};
  const btn = {padding:"8px 14px",background:C.sage,color:C.forest,border:"none",borderRadius:8,fontWeight:600,fontSize:13,cursor:"pointer",fontFamily:"'Karla',sans-serif",whiteSpace:"nowrap"};
  const card = {background:C.card,border:`1.5px solid ${C.border}`,borderRadius:14,padding:"16px 18px"};
  const chip = {padding:"7px 14px",borderRadius:20,border:`1.5px solid ${C.border}`,background:"#fff",fontSize:13,fontWeight:500,cursor:"pointer",transition:"all 0.15s ease"};
 
  return (
    <div style={{fontFamily:"'Karla',sans-serif",background:C.bg,minHeight:"100vh",color:"#1a1a1a"}}>
      <style>{`
        .hov{transition:all 0.15s;cursor:pointer} .hov:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.1)}
        .chov:hover{background:${C.green}!important;color:#fff!important;border-color:${C.green}!important}
        .shov{transition:all 0.15s;cursor:pointer} .shov:hover{border-color:${C.green}!important;background:#eaf3ee!important}
        .shov.act{border-color:${C.green}!important;background:${C.light}!important}
        .fade{animation:fu 0.3s ease both} @keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        a{color:${C.green};text-decoration:none} a:hover{text-decoration:underline}
        .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
        input:focus,select:focus{outline:2px solid ${C.sage}}
        .vbtn{transition:all 0.15s;cursor:pointer;border:none;font-family:'Karla',sans-serif;font-size:12px;font-weight:600}
      `}</style>
 
      {/* HEADER */}
      <div style={hdr}>
        <div style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={reset}>
          <span style={{fontSize:22}}>🌲</span>
          <div>
            <div style={{fontFamily:"'Playfair Display',serif",fontWeight:800,color:"#fff",fontSize:20,lineHeight:1}}>Fetchd</div>
            <div style={{fontSize:10,color:C.sage,letterSpacing:"0.08em",textTransform:"uppercase",marginTop:2}}>Washington Home Services</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          {county && <div style={{background:"#1e3a28",borderRadius:20,padding:"5px 12px",fontSize:12,color:"#a8d5b5",cursor:"pointer"}} onClick={()=>setStep("county")}>📍 {county} · <span style={{opacity:0.6,fontSize:11}}>change</span></div>}
          <button style={{...btn,background:"transparent",color:C.sage,border:`1px solid ${C.sage}`}} onClick={()=>setStep("mission")}>About</button>
          <button style={btn} onClick={()=>setRegisterOpen(true)}>+ List your business</button>
        </div>
      </div>
 
      {/* COUNTY PICKER */}
      {step==="county" && (
        <div style={pg} className="fade">
          <div style={{textAlign:"center",padding:"32px 0 24px"}}>
            <div style={{fontSize:12,color:C.green,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:10}}>🌲 Washington State · Free & local</div>
            <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:"clamp(26px,5vw,44px)",fontWeight:800,lineHeight:1.2,marginBottom:12}}>Find local trades &<br/><span style={{color:C.sage}}>get it fetchd.</span></h1>
            <p style={{fontSize:15,color:C.muted,lineHeight:1.7,maxWidth:480,margin:"0 auto"}}>A free directory connecting Washington residents with local tradespeople and county grants, rebates & programs.</p>
          </div>
          <input style={{width:"100%",padding:"12px 16px",fontSize:15,border:`2px solid ${C.border}`,borderRadius:10,background:"#fff",fontFamily:"'Karla',sans-serif",marginBottom:24}} placeholder="Search your county..." value={search} onChange={e=>setSearch(e.target.value)}/>
          {search===""
            ? Object.entries(WA_COUNTIES).map(([reg,counties])=>(
                <div key={reg} style={{marginBottom:22}}>
                  <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",color:"#7a9e8a",marginBottom:10}}>{reg}</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                    {[...new Set(counties)].map(c=>(
                      <div key={c} className="chov hov" style={chip} onClick={()=>{setCounty(c);setStep("browse");}}>
                        {c} County
                      </div>
                    ))}
                  </div>
                </div>
              ))
            : <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:8}}>
                {filteredCounties.map(c=><div key={c} className="chov hov" style={chip} onClick={()=>{setCounty(c);setStep("browse");}}>{c} County</div>)}
                {filteredCounties.length===0 && <div style={{color:C.muted,padding:"12px 0"}}>No matching county found.</div>}
              </div>
          }
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:24}}>
            {["✅ WA L&I verified","🆓 Free to use","🌲 Washington-only","♿ Accessibility focused"].map(t=>(
              <div key={t} style={{padding:"5px 12px",background:"#fff",border:`1px solid ${C.border}`,borderRadius:20,fontSize:12,color:C.muted}}>{t}</div>
            ))}
          </div>
          <div style={{background:C.forest,borderRadius:12,padding:"18px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",marginTop:20}} onClick={()=>{setQuizStep(0);setQuizAnswers({problem:null,urgency:null,budget:null});setQuizResult(null);setStep("quiz");}}>
            <div>
              <div style={{fontWeight:700,fontSize:15,color:"#fff"}}>🔍 Not sure where to start?</div>
              <div style={{fontSize:13,color:C.sage,marginTop:3}}>Answer 3 quick questions — we'll match you with the right help</div>
            </div>
            <div style={{fontSize:20,color:C.sage}}>→</div>
          </div>
          <div style={{background:"#e8f5ee",border:`1.5px solid #b8dfc8`,borderRadius:12,padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",marginTop:10}} onClick={()=>setStep("mission")}>
            <div><div style={{fontWeight:600,fontSize:14}}>🌲 Our mission</div><div style={{fontSize:12,color:"#5a8a6a",marginTop:2}}>Why we built Fetchd and who it's for</div></div>
            <div style={{fontSize:18,color:C.green}}>→</div>
          </div>
        </div>
      )}
 
      {/* QUIZ */}
      {step==="quiz" && (
        <div style={pg} className="fade">
          <button style={{padding:"7px 14px",background:"#fff",border:`1.5px solid ${C.border}`,borderRadius:8,fontSize:13,fontWeight:600,color:C.green,cursor:"pointer",marginBottom:24}} onClick={()=>setStep("county")}>← Back</button>
 
          {/* Progress dots */}
          <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:28}}>
            {[0,1,2].map(i=>(
              <div key={i} style={{width:i<=quizStep?32:10,height:10,borderRadius:5,background:i<=quizStep?C.green:C.border,transition:"all 0.3s ease"}}/>
            ))}
          </div>
 
          {/* Step 1 — Problem type */}
          {quizStep===0 && (
            <div className="fade">
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:800,marginBottom:6}}>What's the problem?</h2>
              <p style={{fontSize:14,color:C.muted,marginBottom:20}}>Select the option that best describes what you need help with.</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                {[
                  {id:"water",icon:"💧",label:"Water / plumbing"},
                  {id:"electric",icon:"⚡",label:"Electrical"},
                  {id:"heating",icon:"🔥",label:"Heating / cooling"},
                  {id:"roof",icon:"🏠",label:"Roof / structural"},
                  {id:"general",icon:"🪚",label:"General repairs"},
                  {id:"cleaning",icon:"🧹",label:"Cleaning / upkeep"},
                  {id:"outdoor",icon:"🌲",label:"Garden / outdoor"},
                  {id:"painting",icon:"🖌️",label:"Painting"},
                ].map(opt=>(
                  <div key={opt.id} className="hov" style={{...card,textAlign:"center",padding:"18px 12px",cursor:"pointer",border:`1.5px solid ${quizAnswers.problem===opt.id?C.green:C.border}`,background:quizAnswers.problem===opt.id?C.light:"#fff"}}
                    onClick={()=>{setQuizAnswers(a=>({...a,problem:opt.id}));setQuizStep(1);}}>
                    <div style={{fontSize:28,marginBottom:8}}>{opt.icon}</div>
                    <div style={{fontSize:13,fontWeight:600}}>{opt.label}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
 
          {/* Step 2 — Urgency */}
          {quizStep===1 && (
            <div className="fade">
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:800,marginBottom:6}}>How urgent is it?</h2>
              <p style={{fontSize:14,color:C.muted,marginBottom:20}}>This helps us know whether to prioritise emergency programs.</p>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {[
                  {id:"urgent",icon:"🚨",label:"Urgent — needs fixing now",sub:"Safety risk, active leak, no heat etc."},
                  {id:"soon",icon:"📅",label:"Soon — within the next few weeks",sub:"Important but not an emergency"},
                  {id:"planning",icon:"🗓️",label:"Planning ahead",sub:"Not urgent, exploring options"},
                ].map(opt=>(
                  <div key={opt.id} className="hov" style={{...card,display:"flex",alignItems:"center",gap:14,cursor:"pointer",border:`1.5px solid ${quizAnswers.urgency===opt.id?C.green:C.border}`,background:quizAnswers.urgency===opt.id?C.light:"#fff"}}
                    onClick={()=>{setQuizAnswers(a=>({...a,urgency:opt.id}));setQuizStep(2);}}>
                    <span style={{fontSize:24,flexShrink:0}}>{opt.icon}</span>
                    <div>
                      <div style={{fontWeight:600,fontSize:14}}>{opt.label}</div>
                      <div style={{fontSize:12,color:C.muted,marginTop:2}}>{opt.sub}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
 
          {/* Step 3 — Budget */}
          {quizStep===2 && (
            <div className="fade">
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:800,marginBottom:6}}>What's your budget?</h2>
              <p style={{fontSize:14,color:C.muted,marginBottom:20}}>We'll highlight any grants or free programs you may qualify for.</p>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {[
                  {id:"free",icon:"🙏",label:"I need free or subsidised help",sub:"Low income or financial hardship"},
                  {id:"low",icon:"💚",label:"Limited budget — under $500",sub:"Looking for affordable options"},
                  {id:"medium",icon:"💛",label:"Some budget — $500 to $2,000",sub:"Will pay a fair rate"},
                  {id:"flexible",icon:"💰",label:"Flexible — just want quality",sub:"Budget isn't the main concern"},
                ].map(opt=>(
                  <div key={opt.id} className="hov" style={{...card,display:"flex",alignItems:"center",gap:14,cursor:"pointer",border:`1.5px solid ${quizAnswers.budget===opt.id?C.green:C.border}`,background:quizAnswers.budget===opt.id?C.light:"#fff"}}
                    onClick={()=>{const ans={...quizAnswers,budget:opt.id};setQuizAnswers(ans);runQuiz(ans);}}>
                    <span style={{fontSize:24,flexShrink:0}}>{opt.icon}</span>
                    <div>
                      <div style={{fontWeight:600,fontSize:14}}>{opt.label}</div>
                      <div style={{fontSize:12,color:C.muted,marginTop:2}}>{opt.sub}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
 
      {/* QUIZ RESULT */}
      {step==="quiz-result" && quizResult && (
        <div style={pg} className="fade">
          <button style={{padding:"7px 14px",background:"#fff",border:`1.5px solid ${C.border}`,borderRadius:8,fontSize:13,fontWeight:600,color:C.green,cursor:"pointer",marginBottom:24}} onClick={()=>setStep("quiz")}>← Back</button>
 
          <div style={{textAlign:"center",marginBottom:24}}>
            <div style={{fontSize:40,marginBottom:10}}>✅</div>
            <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:800,marginBottom:8}}>Here's what we recommend</h2>
            <p style={{fontSize:14,color:C.muted,lineHeight:1.6}}>Based on your answers — {quizResult.problemLabel}{quizResult.isUrgent?" (urgent)":""}.</p>
          </div>
 
          {/* Recommended service */}
          <div style={{background:C.forest,borderRadius:14,padding:"18px 20px",marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:C.sage,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Recommended tradesperson</div>
            <div style={{fontFamily:"'Playfair Display',serif",color:"#fff",fontSize:20,fontWeight:800,marginBottom:6}}>
              {SERVICES.find(s=>s.label===quizResult.service)?.icon} {quizResult.service}
            </div>
            <div style={{fontSize:13,color:"#a8d5b5",marginBottom:14}}>
              {quizResult.isUrgent ? "This is urgent — look for pros available today." : "Take your time to compare a few options before deciding."}
            </div>
            <button style={{...btn,width:"100%",padding:"11px"}} onClick={()=>{setCounty(null);setStep("county");}}>
              Find a {quizResult.service} in your county →
            </button>
          </div>
 
          {/* Grant/resource nudge */}
          {quizResult.needsGrant && (
            <div style={{background:"#fffbea",border:"1.5px solid #e8d48a",borderRadius:14,padding:"16px 18px",marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:14,color:"#7a5c00",marginBottom:6}}>💰 You may qualify for free or subsidised help</div>
              <div style={{fontSize:13,color:"#7a6a2a",lineHeight:1.6,marginBottom:12}}>
                Washington has grants, loans and free repair programs for income-qualified residents. Check your county's resources tab after selecting your county.
              </div>
              <button style={{...btn,background:"#D4A017",color:"#fff",width:"100%",padding:"11px"}} onClick={()=>{setTab("resources");setStep("county");}}>
                View county resources →
              </button>
            </div>
          )}
 
          {/* Urgency tip */}
          {quizResult.isUrgent && (
            <div style={{background:"#fff0f0",border:"1.5px solid #f5c4b3",borderRadius:14,padding:"16px 18px",marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:14,color:"#712B13",marginBottom:6}}>🚨 For urgent issues</div>
              <div style={{fontSize:13,color:"#993C1D",lineHeight:1.6}}>
                Call Washington 2-1-1 (dial 211) for immediate referrals to emergency home repair programs in your county. Available 24/7.
              </div>
            </div>
          )}
 
          <div style={{fontSize:12,color:C.muted,textAlign:"center",lineHeight:1.6,marginTop:8}}>
            Select your county below to see matching tradespeople and local programs.
          </div>
 
          <div style={{marginTop:20}}>
            <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",color:"#7a9e8a",marginBottom:12}}>Select your county</div>
            <input style={{width:"100%",padding:"12px 16px",fontSize:15,border:`2px solid ${C.border}`,borderRadius:10,background:"#fff",fontFamily:"'Karla',sans-serif",marginBottom:16}} placeholder="Search your county..." value={search} onChange={e=>setSearch(e.target.value)}/>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {(search===""
                ? Object.values(WA_COUNTIES).flat().filter((v,i,a)=>a.indexOf(v)===i).sort()
                : Object.values(WA_COUNTIES).flat().filter((v,i,a)=>a.indexOf(v)===i).filter(c=>c.toLowerCase().includes(search.toLowerCase())).sort()
              ).map(c=>(
                <div key={c} className="chov hov" style={chip} onClick={()=>{setCounty(c);setService(SERVICES.find(s=>s.label===quizResult.service)?.id||null);setTab(quizResult.needsGrant?"resources":"pros");setStep("browse");}}>
                  {c} County
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
 
      {/* MISSION */}
      {step==="mission" && (
        <div style={pg} className="fade">
          <button style={{padding:"7px 14px",background:"#fff",border:`1.5px solid ${C.border}`,borderRadius:8,fontSize:13,fontWeight:600,color:C.green,cursor:"pointer",marginBottom:20}} onClick={()=>setStep(county?"browse":"county")}>← Back</button>
          <div style={{textAlign:"center",padding:"20px 0 24px"}}>
            <div style={{fontSize:44,marginBottom:10}}>🌲</div>
            <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:"clamp(26px,5vw,38px)",fontWeight:800,marginBottom:12}}>Our mission</h1>
            <p style={{fontSize:15,color:C.muted,lineHeight:1.7}}>Finding help for your home shouldn't be hard, and knowing what help you're entitled to shouldn't be a secret.</p>
          </div>
          {[
            {icon:"📍",title:"County-first, always",body:"National platforms treat Washington like every other state. Fetchd is built around your county — because a homeowner in Spokane has different resources and tradespeople than someone in King County."},
            {icon:"🆓",title:"Free forever",body:"Fetchd is free for homeowners and free for tradespeople to list. No booking fees, no lead charges, no subscriptions. We connect people — you deal directly with each other."},
            {icon:"💰",title:"Resources most people don't know about",body:"Washington has over 100 home repair grant, loan and rebate programs. Most residents have never heard of them. Fetchd surfaces the real programs available in your county."},
            {icon:"✅",title:"Trust through transparency",body:"Every pro shows their WA L&I license status, years of experience, specialties and rate upfront. No surprises. We link directly to WA L&I so you can verify anyone before hiring."},
            {icon:"🗣️",title:"Built for everyone in Washington",body:"Fetchd surfaces multilingual tradespeople and accessibility-focused programs because language and mobility shouldn't be barriers to getting your home fixed."},
            {icon:"🌲",title:"Washington-built, Washington-focused",body:"Fetchd isn't a national platform that added Washington to a dropdown. It's built specifically for the 39 counties of Washington State."},
          ].map((c,i)=>(
            <div key={i} style={{...card,flexDirection:"column",marginBottom:10,display:"flex"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                <span style={{fontSize:22}}>{c.icon}</span>
                <div style={{fontFamily:"'Playfair Display',serif",fontWeight:700,fontSize:16,color:C.forest}}>{c.title}</div>
              </div>
              <div style={{fontSize:14,color:C.muted,lineHeight:1.7}}>{c.body}</div>
            </div>
          ))}
          <div style={{background:C.forest,borderRadius:14,padding:"22px",textAlign:"center",marginTop:8}}>
            <div style={{fontFamily:"'Playfair Display',serif",color:"#fff",fontSize:18,fontWeight:800,marginBottom:8}}>Ready to get started?</div>
            <div style={{color:C.sage,fontSize:13,marginBottom:14}}>Find a tradesperson in your county or list your business for free.</div>
            <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
              <button style={btn} onClick={()=>setStep("county")}>Find a tradesperson</button>
              <button style={{...btn,background:"transparent",border:`1px solid ${C.sage}`,color:C.sage}} onClick={()=>setRegisterOpen(true)}>List your business</button>
            </div>
          </div>
        </div>
      )}
 
      {/* BROWSE */}
      {step==="browse" && (
        <div style={pg} className="fade">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontSize:12,color:C.green,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:4}}>📍 {region}</div>
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:28,fontWeight:800}}>{county} County</h2>
            </div>
            <div style={{display:"flex",gap:8}}>
              <div style={{padding:"4px 12px",background:C.light,borderRadius:20,fontSize:12,color:C.green,fontWeight:600}}>{allPros.length} pros</div>
              <div style={{padding:"4px 12px",background:C.light,borderRadius:20,fontSize:12,color:C.green,fontWeight:600}}>{rawResources.length} resources</div>
            </div>
          </div>
 
          {/* Tabs */}
          <div style={{display:"flex",borderRadius:10,overflow:"hidden",border:`1.5px solid ${C.border}`,marginBottom:20}}>
            {[["pros","🔧 Find a tradesperson"],["resources","💰 County resources"]].map(([t,l])=>(
              <button key={t} className="vbtn" style={{flex:1,padding:"11px 8px",background:tab===t?C.green:"#fff",color:tab===t?"#fff":C.muted,border:"none"}} onClick={()=>setTab(t)}>{l}</button>
            ))}
          </div>
 
          {/* PROS TAB */}
          {tab==="pros" && (
            <div className="fade">
              <div style={{marginBottom:14,position:"relative"}}>
                <input
                  style={{width:"100%",padding:"11px 16px",fontSize:14,border:`2px solid ${C.border}`,borderRadius:10,background:"#fff",fontFamily:"'Karla',sans-serif"}}
                  placeholder="🔍 Search by keyword — e.g. leak repair, deck, drywall..."
                  value={proSearch}
                  onChange={e=>setProSearch(e.target.value)}
                />
                {searchSuggestions.length>0 && (
                  <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:`1.5px solid ${C.border}`,borderRadius:10,boxShadow:"0 4px 16px rgba(0,0,0,0.1)",zIndex:20,marginTop:4,overflow:"hidden"}}>
                    {searchSuggestions.map(s=>(
                      <div key={s} style={{padding:"10px 16px",fontSize:13,cursor:"pointer",borderBottom:`0.5px solid ${C.border}`}} onClick={()=>setProSearch(s)}
                        onMouseEnter={e=>e.target.style.background="#f0f7f2"}
                        onMouseLeave={e=>e.target.style.background="#fff"}>
                        🔍 {s}
                      </div>
                    ))}
                  </div>
                )}
                {proSearch && <button style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",fontSize:16,cursor:"pointer",color:C.muted}} onClick={()=>setProSearch("")}>✕</button>}
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#f0f7f2",border:`1px solid #b8dfc8`,borderRadius:10,padding:"10px 14px",marginBottom:14}}>
                <div>
                  <div style={{fontWeight:600,fontSize:13,color:C.forest}}>✅ Always verify before hiring</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>Every pro has a direct WA L&I license check link.</div>
                </div>
                <a href="https://secure.lni.wa.gov/verify" target="_blank" style={{fontSize:12,color:C.green,fontWeight:600,whiteSpace:"nowrap"}}>Open L&I →</a>
              </div>
 
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
                <div className="shov" style={{...chip,...(service===null?{borderColor:C.green,background:C.light}:{})}} onClick={()=>setService(null)}>All</div>
                {SERVICES.map(sv=>(
                  <div key={sv.id} className={`shov${service===sv.id?" act":""}`} style={chip} onClick={()=>setService(service===sv.id?null:sv.id)}>{sv.icon} {sv.label}</div>
                ))}
              </div>
 
              <div style={{background:"#fff",border:`1.5px solid ${C.border}`,borderRadius:12,padding:"14px 16px",marginBottom:14,display:"flex",gap:20,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:160}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                    <span style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"#7a9e8a"}}>Max rate</span>
                    <span style={{fontSize:13,fontWeight:600,color:C.forest}}>{maxRate>=150?"Any":`up to $${maxRate}/hr`}</span>
                  </div>
                  <input type="range" min={40} max={150} step={5} value={maxRate} onChange={e=>setMaxRate(Number(e.target.value))} style={{width:"100%",accentColor:C.green}}/>
                  <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
                    {["$40","$70","$100","$130","Any"].map(t=><span key={t} style={{fontSize:10,color:"#7a9e8a"}}>{t}</span>)}
                  </div>
                </div>
                {allLangs.length>2 && (
                  <div style={{flex:1,minWidth:140}}>
                    <div style={{marginBottom:6}}><span style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"#7a9e8a"}}>Language</span></div>
                    <select style={{padding:"6px 10px",borderRadius:8,border:`1.5px solid ${C.border}`,background:"#fff",fontSize:13,fontFamily:"'Karla',sans-serif"}} value={langFilter} onChange={e=>setLangFilter(e.target.value)}>
                      {allLangs.map(l=><option key={l}>{l}</option>)}
                    </select>
                  </div>
                )}
              </div>
 
              {filteredPros.length>0 ? (
                <div style={{display:"flex",flexDirection:"column",gap:12}}>
                  {filteredPros.map((pro,i)=>(
                    <div key={i} style={{...card,display:"flex",alignItems:"center",gap:14}} className="hov">
                      <div style={{width:46,height:46,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,color:"#fff",fontSize:14,flexShrink:0,background:avatarColors[i%avatarColors.length]}}>{pro.initials}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                          <div style={{fontWeight:600,fontSize:15}}>{pro.name}</div>
                          <div style={{fontSize:11,padding:"2px 8px",background:C.light,color:C.green,borderRadius:10,fontWeight:600}}>{SERVICES.find(s=>s.label===pro.service)?.icon} {pro.service}</div>
                        </div>
                        <div style={{fontSize:13,color:C.muted,marginTop:2}}>{pro.years} yrs · {county} County</div>
                        {pro.specialties && <div style={{fontSize:12,color:"#7a9e8a",marginTop:3}}>{pro.specialties.join(" · ")}</div>}
                        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
                          {pro.licensed && <span style={{fontSize:11,padding:"2px 8px",background:"#e8f5ee",border:`1px solid #b8dfc8`,borderRadius:10,color:C.green}}>✅ WA Licensed</span>}
                          {pro.insured && <span style={{fontSize:11,padding:"2px 8px",background:"#e8f5ee",border:`1px solid #b8dfc8`,borderRadius:10,color:C.green}}>🛡️ Insured</span>}
                          {pro.languages?.filter(l=>l!=="English").map(l=><span key={l} style={{fontSize:11,padding:"2px 8px",background:"#e8f0fe",borderRadius:10,color:"#1a56a0"}}>🗣️ {l}</span>)}
                        </div>
                        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
                          <a href={`https://secure.lni.wa.gov/verify/?country=WA&PermitType=CC&q=${encodeURIComponent(pro.name)}`} target="_blank" style={{fontSize:11,padding:"4px 10px",background:"#f0f7f2",border:`1px solid #b8dfc8`,borderRadius:8,color:C.green,fontWeight:600}}>🔍 Verify on WA L&I</a>
                          {pro.website && <a href={`https://${pro.website}`} target="_blank" style={{fontSize:11,padding:"4px 10px",background:"#f0f7f2",border:`1px solid #b8dfc8`,borderRadius:8,color:C.green,fontWeight:600}}>🌐 Website</a>}
                        </div>
                        {pro.badge && <div style={{fontSize:10,marginTop:5,padding:"3px 8px",background:"#fef3e8",border:"1px solid #f5c4b3",borderRadius:8,color:"#7a3a00",fontWeight:500,display:"inline-block"}}>{pro.badge}</div>}
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8,flexShrink:0}}>
                        {pro.rate && <div style={{fontSize:13,fontWeight:700,color:"#7a5c00",background:"#fffbea",border:"1px solid #e8d48a",borderRadius:8,padding:"3px 10px",whiteSpace:"nowrap"}}>{pro.rate}</div>}
                        <button style={{...btn,background:C.forest,color:"#fff"}} onClick={()=>setContactPro(pro)}>Get contact</button>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{textAlign:"center",padding:"40px 20px",color:C.muted}}>
                  <div style={{fontSize:32,marginBottom:10}}>🔍</div>
                  <div style={{fontWeight:500,marginBottom:6}}>No pros listed yet for {county} County</div>
                  <div style={{fontSize:13}}>Know a great local tradesperson? Share Fetchd with them.</div>
                  <button style={{...btn,marginTop:12}} onClick={()=>setRegisterOpen(true)}>+ List a business</button>
                </div>
              )}
              <div style={{marginTop:20,padding:"12px 16px",background:"#f0f7f2",borderRadius:10,fontSize:12,color:C.muted,lineHeight:1.6}}>
                Fetchd is a free directory. Always verify licenses at <a href="https://secure.lni.wa.gov/verify" target="_blank">WA L&I</a> before hiring.
              </div>
            </div>
          )}
 
          {/* RESOURCES TAB */}
          {tab==="resources" && (
            <div className="fade">
              <p style={{fontSize:14,color:C.muted,marginBottom:12,lineHeight:1.6}}>Real programs available to {county} County residents — grants, loans and rebates to help cover home repairs.</p>
              <div style={{display:"flex",borderRadius:10,overflow:"hidden",border:`1.5px solid ${C.border}`,marginBottom:12}}>
                {[["all","All"],["public","🏛️ Public"],["private","🤝 Private"]].map(([v,l])=>(
                  <button key={v} className="vbtn" style={{flex:1,padding:"9px 6px",background:visFilter===v?C.green:"#fff",color:visFilter===v?"#fff":C.muted,textAlign:"center",border:"none"}} onClick={()=>setVisFilter(v)}>{l}</button>
                ))}
              </div>
              {visFilter!=="all" && (
                <div style={{fontSize:12,color:C.muted,marginBottom:12,padding:"8px 12px",background:"#f0f7f2",borderRadius:8}}>
                  {visFilter==="public" ? "🏛️ Government-funded — county, city or state agencies. Eligibility is usually income-based." : "🤝 Nonprofits, utilities and community organisations. Some are open to all residents."}
                </div>
              )}
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {resources.length>0 ? resources.map((r,i)=>(
                  <a key={i} href={r.url} target="_blank" style={{display:"flex",alignItems:"center",gap:14,background:C.card,border:`1.5px solid ${C.border}`,borderRadius:12,padding:"14px 16px",textDecoration:"none",color:"inherit"}}>
                    <div style={{fontSize:22,flexShrink:0}}>{r.icon}</div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:2}}>
                        <div style={{fontSize:10,fontWeight:700,color:C.sage,textTransform:"uppercase",letterSpacing:"0.1em"}}>{r.type}</div>
                        <span style={{fontSize:10,padding:"1px 6px",borderRadius:8,fontWeight:600,background:r.visibility==="public"?"#e8f0fe":"#f0e8fe",color:r.visibility==="public"?"#1a56a0":"#5b21b6"}}>{r.visibility==="public"?"Public":"Private"}</span>
                      </div>
                      <div style={{fontWeight:600,fontSize:14,color:"#1a1a1a",marginTop:2}}>{r.name}</div>
                      <div style={{fontSize:12,color:C.muted,marginTop:2}}>{r.desc}</div>
                    </div>
                    <div style={{color:C.sage,fontSize:18}}>→</div>
                  </a>
                )) : (
                  <div style={{textAlign:"center",padding:"24px",color:C.muted,fontSize:14}}>
                    No {visFilter} programs listed for {county} County.
                    <button style={{...btn,marginTop:10,background:"transparent",color:C.green,border:`1px solid ${C.border}`}} onClick={()=>setVisFilter("all")}>Show all</button>
                  </div>
                )}
              </div>
              <div style={{marginTop:20,padding:"12px 16px",background:"#f0f7f2",borderRadius:10,fontSize:12,color:C.muted,lineHeight:1.6}}>
                <strong>Statewide programs available to all 39 counties:</strong>
                <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:6}}>
                  {DEFAULT_RESOURCES.map(r=><a key={r.name} href={r.url} target="_blank" style={{fontSize:13,color:C.green}}>{r.icon} {r.name}</a>)}
                </div>
              </div>
            </div>
          )}
        </div>
      )}
 
      {/* CONTACT MODAL */}
      {contactPro && (
        <div className="modal-bg" onClick={()=>setContactPro(null)}>
          <div style={{background:"#fff",borderRadius:16,padding:"22px",maxWidth:420,width:"100%",maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
              <div>
                <div style={{fontWeight:600,fontSize:16}}>{contactPro.name}</div>
                <div style={{fontSize:13,color:C.muted,marginTop:2}}>{contactPro.service} · {county} County</div>
              </div>
              <button style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:C.muted}} onClick={()=>setContactPro(null)}>✕</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
              <a href={`tel:${contactPro.phone}`} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",background:C.bg,borderRadius:10,fontSize:15,color:"#1a1a1a",textDecoration:"none",fontWeight:500}}>
                <span style={{fontSize:18}}>📞</span><span>{contactPro.phone}</span>
              </a>
              <a href={`mailto:${contactPro.email}`} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",background:C.bg,borderRadius:10,fontSize:15,color:"#1a1a1a",textDecoration:"none",fontWeight:500}}>
                <span style={{fontSize:18}}>✉️</span><span>{contactPro.email}</span>
              </a>
            </div>
            {contactPro.rate && (
              <div style={{marginBottom:10,background:"#fffbea",borderLeft:"3px solid #D4A017",borderRadius:"0 8px 8px 0",padding:"10px 12px"}}>
                <strong style={{fontSize:13}}>💰 Typical rate: {contactPro.rate}</strong>
                <div style={{fontSize:12,marginTop:3,color:"#7a6a2a"}}>Always ask for a written quote before work begins.</div>
              </div>
            )}
            {contactPro.specialties && (
              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,fontWeight:700,color:C.sage,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Specialties</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {contactPro.specialties.map(sp=><span key={sp} style={{fontSize:12,padding:"3px 10px",background:"#e8f5ee",border:"1px solid #b8dfc8",borderRadius:10,color:C.green}}>{sp}</span>)}
                </div>
              </div>
            )}
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
              {contactPro.licensed && <span style={{fontSize:11,padding:"2px 8px",background:"#e8f5ee",border:`1px solid #b8dfc8`,borderRadius:10,color:C.green}}>✅ WA Licensed</span>}
              {contactPro.insured && <span style={{fontSize:11,padding:"2px 8px",background:"#e8f5ee",border:`1px solid #b8dfc8`,borderRadius:10,color:C.green}}>🛡️ Insured</span>}
              {contactPro.languages?.map(l=><span key={l} style={{fontSize:11,padding:"2px 8px",background:"#e8f5ee",border:`1px solid #b8dfc8`,borderRadius:10,color:C.green}}>🗣️ {l}</span>)}
            </div>
            <a href={`https://secure.lni.wa.gov/verify/?country=WA&PermitType=CC&q=${encodeURIComponent(contactPro.name)}`} target="_blank" style={{display:"block",textAlign:"center",marginBottom:8,fontSize:12,padding:"8px",background:"#f0f7f2",border:`1px solid #b8dfc8`,borderRadius:8,color:C.green,fontWeight:600,textDecoration:"none"}}>
              🔍 Verify {contactPro.name} on WA L&I
            </a>
            {contactPro.website && <a href={`https://${contactPro.website}`} target="_blank" style={{display:"block",textAlign:"center",marginBottom:12,fontSize:12,padding:"8px",background:"#f0f7f2",border:`1px solid #b8dfc8`,borderRadius:8,color:C.green,fontWeight:600,textDecoration:"none"}}>🌐 Visit website</a>}
            {contactPro.badge && <div style={{fontSize:11,marginBottom:12,padding:"6px 10px",background:"#fef3e8",border:"1px solid #f5c4b3",borderRadius:8,color:"#7a3a00",fontWeight:500}}>{contactPro.badge}</div>}
            <div style={{fontSize:12,color:C.muted,lineHeight:1.6,padding:"10px 12px",background:"#f0f7f2",borderRadius:8}}>
              Fetchd is a free directory — we connect you directly, no middleman fees or lead charges.
            </div>
          </div>
        </div>
      )}
 
      {/* REGISTER MODAL */}
      {registerOpen && (
        <div className="modal-bg" onClick={()=>setRegisterOpen(false)}>
          <div style={{background:"#fff",borderRadius:16,padding:"22px",maxWidth:420,width:"100%",maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{fontWeight:600,fontSize:16}}>List your business</div>
              <button style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:C.muted}} onClick={()=>setRegisterOpen(false)}>✕</button>
            </div>
            <div style={{background:"#e8f5ee",borderRadius:10,padding:"12px 14px",marginBottom:14}}>
              <div style={{fontWeight:600,fontSize:14,color:"#1B4332",marginBottom:4}}>🌲 Free forever. No lead fees. No cold calls.</div>
              <div style={{fontSize:13,color:C.muted,lineHeight:1.6}}>Homeowners contact you directly — you choose who to work with.</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {[{l:"Business name",p:"e.g. Pacific NW Plumbing"},{l:"WA L&I License number",p:"e.g. PACIFNP123BB"},{l:"Phone number",p:"(206) 555-0000"},{l:"Email address",p:"you@yourbusiness.com"}].map(f=>(
                <div key={f.l}>
                  <label style={{display:"block",fontSize:13,fontWeight:500,marginBottom:4}}>{f.l}</label>
                  <input style={{width:"100%",padding:"10px 12px",border:`1.5px solid ${C.border}`,borderRadius:8,fontSize:14,fontFamily:"'Karla',sans-serif"}} placeholder={f.p}/>
                </div>
              ))}
              <div>
                <label style={{display:"block",fontSize:13,fontWeight:500,marginBottom:4}}>County</label>
                <select style={{width:"100%",padding:"10px 12px",border:`1.5px solid ${C.border}`,borderRadius:8,fontSize:14,fontFamily:"'Karla',sans-serif"}}>
                  {Object.values(WA_COUNTIES).flat().filter((v,i,a)=>a.indexOf(v)===i).sort().map(c=><option key={c}>{c} County</option>)}
                </select>
              </div>
              <div>
                <label style={{display:"block",fontSize:13,fontWeight:500,marginBottom:4}}>Service type</label>
                <select style={{width:"100%",padding:"10px 12px",border:`1.5px solid ${C.border}`,borderRadius:8,fontSize:14,fontFamily:"'Karla',sans-serif"}}>
                  {SERVICES.map(sv=><option key={sv.id}>{sv.label}</option>)}
                </select>
              </div>
              <div>
                <label style={{display:"block",fontSize:13,fontWeight:500,marginBottom:4}}>Your specialties</label>
                <input style={{width:"100%",padding:"10px 12px",border:`1.5px solid ${C.border}`,borderRadius:8,fontSize:14,fontFamily:"'Karla',sans-serif"}} placeholder="e.g. Leak repair, Water heaters"/>
              </div>
              <div>
                <label style={{display:"block",fontSize:13,fontWeight:500,marginBottom:4}}>Typical hourly rate <span style={{fontWeight:400,color:"#7a9e8a"}}>(optional)</span></label>
                <input style={{width:"100%",padding:"10px 12px",border:`1.5px solid ${C.border}`,borderRadius:8,fontSize:14,fontFamily:"'Karla',sans-serif"}} placeholder="e.g. $80–120/hr"/>
              </div>
            </div>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSchifk1lbvM8QbEyTt4MlYamKfcm64Np5XUHwqZ7s7vTVFI6w/viewform" target="_blank" rel="noreferrer" style={{...btn,width:"100%",marginTop:14,padding:"13px",fontSize:15,display:"block",textAlign:"center",textDecoration:"none"}}>Submit listing →</a>
            <div style={{fontSize:12,color:C.muted,lineHeight:1.6,padding:"10px 12px",background:"#f0f7f2",borderRadius:8,marginTop:10}}>
              We'll verify your WA L&I license before publishing. Free forever.
            </div>
          </div>
        </div>
      )}
    {/* FOOTER */}
      <div style={{background:C.forest,padding:"28px 20px",marginTop:40}}>
        <div style={{maxWidth:640,margin:"0 auto",display:"flex",flexDirection:"column",gap:10,alignItems:"center",textAlign:"center"}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontWeight:800,color:"#fff",fontSize:18}}>fetchd</div>
          <div style={{fontSize:11,color:C.sage,letterSpacing:"0.08em",textTransform:"uppercase"}}>Washington Home Services</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:16,justifyContent:"center",marginTop:6}}>
            <a href="mailto:fetchedinquiries@gmail.com" style={{fontSize:12,color:"#7db899",textDecoration:"none"}}>✉️ fetchedinquiries@gmail.com</a>
            <a href="https://instagram.com/fetc_hd" target="_blank" style={{fontSize:12,color:"#7db899",textDecoration:"none"}}>📸 @fetc_hd</a>
          </div>
          <div style={{fontSize:11,color:"#3a6b52",marginTop:8}}>© 2025 Fetchd · Free for homeowners · Free for tradespeople · Always</div>
        </div>
      </div>
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
